# Exactly one Machine; immediate proxy observed on the sin host.
app = "twinguard-demo"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30
[build]
  dockerfile = "Dockerfile"
[deploy]
  strategy = "rolling"
  max_unavailable = 1
[env]
  PORT = "8080"
  AEGIS_TRUSTED_HOSTS = "twinguard-demo.fly.dev"
  AEGIS_TRUSTED_PROXY_CIDRS = "172.16.11.2/32"
  AEGIS_PROXY_PROVIDER = "fly"
  AEGIS_MODEL_PROVIDER = "deepseek"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/readyz"
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
[mounts]
  source = "aegis_data"
  destination = "/data"
  initial_size = "1gb"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
