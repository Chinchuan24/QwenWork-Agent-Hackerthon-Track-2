# Replace app name and trusted host before use; exactly one Machine.
app = "replace-with-your-aegis-app"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30
[build]
  dockerfile = "Dockerfile"
[deploy]
  strategy = "rolling"
  max_unavailable = 1
[env]
  PORT = "8080"
  AEGIS_TRUSTED_HOSTS = "replace-with-your-aegis-app.fly.dev"
  AEGIS_TRUSTED_PROXY_CIDRS = ""
  AEGIS_MODEL_PROVIDER = "qwen"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/readyz"
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
[mounts]
  source = "aegis_data"
  destination = "/data"
  initial_size = "1gb"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
