{% extends "base.html" %}
{% block content %}
<div class="card narrow">
<h1>Sign in</h1>
{% if error %}<div class="banner danger">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
<p class="muted">Demo accounts: dana / demo-dana-2026 (admin, gives tasks) · ops / demo-ops-2026 (approver) · audi / demo-audi-2026 (auditor). The person who set a task cannot approve it.</p>
</div>
{% endblock %}
