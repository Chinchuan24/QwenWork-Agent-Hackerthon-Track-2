{% extends "base.html" %}
{% block content %}
<div class="card narrow">
<h1>Change password</h1>
{% if error %}<div class="banner danger">{{ error }}</div>{% endif %}
{% if user.must_change %}<div class="banner note">Your account uses a published demo password. Privileged actions are refused until you set a new one.</div>{% endif %}
<form method="post" action="/change-password">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password (at least 10 characters) <input name="new" type="password" autocomplete="new-password" required></label>
  <button type="submit">Change password</button>
</form>
</div>
{% endblock %}
