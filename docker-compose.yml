services:
  aegis:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AEGIS_TRUSTED_HOSTS: "${AEGIS_TRUSTED_HOSTS:?Set explicit HTTPS public hostname}"
      AEGIS_TRUSTED_PROXY_CIDRS: "${AEGIS_TRUSTED_PROXY_CIDRS:?Set actual reverse proxy CIDRs}"
    volumes:
      - aegis_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
volumes:
  aegis_data:
